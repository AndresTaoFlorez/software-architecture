<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Creating a ticket: Ports and Adapters in one system view</title>
  <desc id="diagram-description">A unified dark-mode architecture diagram. At runtime the Screen calls useTickets, useTickets calls createTicket, createTicket calls the injected HttpTicketGateway, and the adapter sends POST /api/tickets to the external Backend API. Dashed source-code relationships show createTicket depending on TicketGateway and HttpTicketGateway implementing that port. Separate green startup wiring shows bootstrap creating and injecting the adapter, then supplying the ready createTicket operation to Presentation. Bootstrap is not a runtime hop.</desc>

  <defs>
    <style>
      text { font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #28323C; }
      .band { fill: #111827; fill-opacity: 0.025; }
      .structure { stroke: #AEB7C2; }
      .runtime-stroke { stroke: #303A45; }
      .runtime-fill { fill: #303A45; }
      .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .title { font-size: 23px; font-weight: 600; }
      .subtitle { font-size: 14px; fill: #5E6976; }
      .layer { font-size: 15px; font-weight: 600; }
      .layer-note { font-size: 12px; fill: #5E6976; }
      .name { font-size: 16px; font-weight: 600; }
      .role { font-size: 12.5px; fill: #5E6976; }
      .desc { font-size: 13px; fill: #46525F; }
      .edge-label { font-size: 12px; fill: #5E6976; }
      .edge-label-startup { font-size: 12px; fill: #4F7D6E; }
      .edge-label-external { font-size: 12px; fill: #85662F; }
      .legend { font-size: 11.5px; fill: #5E6976; }
      .step { font-size: 10.5px; font-weight: 700; fill: #F7F8FA; text-anchor: middle; dominant-baseline: central; }
      .purple-text { fill: #5D537A; }
      .green-text { fill: #4F7D6E; }
      .warm-text { fill: #85662F; }
      @media (prefers-color-scheme: dark) {
        text { fill: #E7EAEE; }
        .subtitle, .layer-note, .role, .edge-label, .legend { fill: #9FA8B3; }
        .desc { fill: #C2C8D0; }
        .edge-label-startup, .green-text { fill: #B8D2C8; }
        .edge-label-external, .warm-text { fill: #CDB07B; }
        .purple-text { fill: #D1CBE1; }
        .band { fill: #FFFFFF; fill-opacity: 0.03; }
        .structure { stroke: #E7EAEE; }
        .runtime-strokke { stroke: #E7EAEE; }
        .runtime-fill { fill: #E7EAEE; }
        .step { fill: #171A1F; }
      }
    </style>

    <marker id="runtime-arrow" viewBox="0 0 11 10" refX="10" refY="5" markerWidth="10" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L10 5 L1 9 z" class="runtime-fill"/>
    </marker>
    <marker id="external-arrow" viewBox="0 0 11 10" refX="10" refY="5" markerWidth="10" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L10 5 L1 9 z" fill="#C9A66B"/>
    </marker>
    <marker id="source-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#A79DC5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="implements-arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1.5 1.5 L10.5 6 L1.5 10.5 z" fill="none" stroke="#A79DC5" stroke-width="1.25" stroke-linejoin="round"/>
    </marker>
    <marker id="startup-arrow" viewBox="0 0 11 10" refX="10" refY="5" markerWidth="9" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L10 5 L1 9 z" fill="#7FAE9D"/>
    </marker>
  </defs>

  <!-- Header: the SVG itself has no background rectangle. -->
  <text x="48" y="54" class="title">Creating a ticket</text>
  <text x="48" y="82" class="subtitle">One system view - runtime calls, source dependencies, and startup wiring</text>

  <!-- Compact semantic legend -->
  <g transform="translate(885 44)">
    <line x1="0" y1="0" x2="42" y2="0" class="runtime-stroke" stroke-width="2.3" marker-end="url(#runtime-arrow)"/>
    <text x="54" y="4" class="legend">runtime</text>
    <line x1="150" y1="0" x2="192" y2="0" stroke="#A79DC5" stroke-width="1.35" stroke-dasharray="5 4" marker-end="url(#source-arrow)"/>
    <text x="204" y="4" class="legend">source relationship</text>
    <line x1="340" y1="0" x2="382" y2="0" stroke="#7FAE9D" stroke-width="1.5" marker-end="url(#startup-arrow)"/>
    <text x="394" y="4" class="legend">startup wiring</text>
  </g>

  <!-- Layer bands: transparent overall; only subtle translucent structure. -->
  <g id="layers">

    <line x1="48" y1="112" x2="1392" y2="112" class="structure" stroke-opacity="0.14"/>
    <line x1="48" y1="302" x2="1392" y2="302" class="structure" stroke-opacity="0.14"/>
    <line x1="48" y1="502" x2="1392" y2="502" class="structure" stroke-opacity="0.14"/>
    <line x1="48" y1="702" x2="1392" y2="702" class="structure" stroke-opacity="0.32" stroke-dasharray="6 6"/>
    <line x1="48" y1="892" x2="1392" y2="892" class="structure" stroke-opacity="0.14"/>

    <rect x="48" y="126" width="3" height="162" rx="1.5" fill="#8E9AA9"/>
    <rect x="48" y="316" width="3" height="172" rx="1.5" fill="#7F98BC"/>
    <rect x="48" y="516" width="3" height="172" rx="1.5" fill="#7FAE9D"/>
    <rect x="48" y="716" width="3" height="162" rx="1.5" fill="#C9A66B"/>

    <text x="70" y="142" class="layer">Presentation</text>
    <text x="70" y="163" class="layer-note">UI and presentation state</text>

    <text x="70" y="332" class="layer">Application</text>
    <text x="70" y="353" class="layer-note">use case and outbound contract</text>

    <text x="70" y="532" class="layer">Infrastructure</text>
    <text x="70" y="553" class="layer-note">technical implementation</text>

    <text x="70" y="732" class="layer warm-text">External</text>
    <text x="70" y="753" class="layer-note">outside this frontend</text>
  </g>

  <!-- ==================== PRESENTATION ==================== -->
  <g id="screen">
    <rect x="280" y="154" width="230" height="112" rx="8" fill="#93A0B2" fill-opacity="0.11" stroke="#93A0B2" stroke-opacity="0.58" stroke-width="1.2"/>
    <line x1="281.5" y1="166" x2="281.5" y2="254" stroke="#93A0B2" stroke-width="3" stroke-linecap="round"/>
    <text x="301" y="187" class="name">Screen</text>
    <text x="301" y="208" class="role">UI component</text>
    <text x="301" y="233" class="desc">Shows the form and</text>
    <text x="301" y="250" class="desc">starts the action</text>
  </g>

  <g id="hook">
    <rect x="610" y="154" width="250" height="112" rx="8" fill="#8496AA" fill-opacity="0.11" stroke="#8496AA" stroke-opacity="0.58" stroke-width="1.2"/>
    <line x1="611.5" y1="166" x2="611.5" y2="254" stroke="#8496AA" stroke-width="3" stroke-linecap="round"/>
    <text x="631" y="187" class="name mono">useTickets()</text>
    <text x="631" y="208" class="role">Presentation hook</text>
    <text x="631" y="233" class="desc">Owns UI state; submit calls</text>
    <text x="631" y="250" class="desc">the supplied operation</text>
  </g>

  <!-- Runtime: Screen -> useTickets -->
  <line x1="516" y1="210" x2="604" y2="210" class="runtime-stroke" stroke-width="2.35" marker-end="url(#runtime-arrow)"/>
  <circle cx="551" cy="190" r="10" class="runtime-fill"/>
  <text x="551" y="190" class="step">1</text>
  <text x="560" y="236" class="edge-label">uses hook</text>

  <!-- ==================== APPLICATION ==================== -->
  <g id="port">
    <rect x="280" y="346" width="230" height="112" rx="8" fill="#A79DC5" fill-opacity="0.065" stroke="#A79DC5" stroke-opacity="0.62" stroke-width="1.2" stroke-dasharray="5 4"/>
    <line x1="281.5" y1="358" x2="281.5" y2="446" stroke="#A79DC5" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round"/>
    <text x="301" y="379" class="name mono purple-text">TicketGateway</text>
    <text x="301" y="400" class="role">Port / contract</text>
    <text x="301" y="425" class="desc">Defines the create(input)</text>
    <text x="301" y="442" class="desc">capability the use case needs</text>
  </g>

  <g id="usecase">
    <rect x="610" y="346" width="250" height="112" rx="8" fill="#7F98BC" fill-opacity="0.12" stroke="#7FAE9D" stroke-opacity="0.62" stroke-width="1.2"/>
    <line x1="611.5" y1="358" x2="611.5" y2="446" stroke="#7F98BC" stroke-width="3" stroke-linecap="round"/>
    <text x="631" y="379" class="name mono">createTicket()</text>
    <text x="631" y="400" class="role">Use case</text>
    <text x="631" y="425" class="desc">Coordinates ticket creation</text>
    <text x="631" y="442" class="desc">without knowing HTTP</text>
  </g>

  <!-- Runtime: useTickets -> createTicket -->
  <line x1="735" y1="272" x2="735" y2="340" class="runtime-stroke" stroke-width="2.35" marker-end="url(#runtime-arrow)"/>
  <circle cx="755" cy="305" r="10" class="runtime-fill"/>
  <text x="755" y="305" class="step">2</text>
  <text x="775" y="309" class="edge-label">calls supplied createTicket</text>

  <!-- Source: createTicket depends on TicketGateway -->
  <line x1="604" y1="402" x2="516" y2="402" stroke="#A79DC5" stroke-width="1.35" stroke-dasharray="5 4" marker-end="url(#source-arrow)"/>
  <text x="560" y="389" class="edge-label" text-anchor="middle">depends on</text>

  <!-- ==================== INFRASTRUCTURE ==================== -->
  <g id="adapter">
    <rect x="610" y="546" width="250" height="112" rx="8" fill="#7FAE9D" fill-opacity="0.11" stroke="#7FAE9D" stroke-opacity="0.62" stroke-width="1.2"/>
    <line x1="611.5" y1="558" x2="611.5" y2="646" stroke="#7FAE9D" stroke-width="3" stroke-linecap="round"/>
    <text x="631" y="579" class="name mono">HttpTicketGateway</text>
    <text x="631" y="600" class="role">HTTP adapter</text>
    <text x="631" y="625" class="desc">Validates and maps the</text>
    <text x="631" y="642" class="desc">external HTTP contract</text>
  </g>

  <!-- Runtime: createTicket -> injected adapter -->
  <line x1="735" y1="464" x2="735" y2="540" class="runtime-stroke" stroke-width="2.35" marker-end="url(#runtime-arrow)"/>
  <circle cx="755" cy="501" r="10" class="runtime-fill"/>
  <text x="755" y="501" class="step">3</text>
  <text x="775" y="505" class="edge-label">gateway.create(input)</text>

  <!-- Source: adapter implements port -->
  <path d="M604 602 H6560 Q548 602 548 590 V470 Q548 458 536 458 H516" fill="none" stroke="#A79DC5" stroke-width="1.35" stroke-dasharray="5 4" marker-end="url(#implements-arrow)"/>
  <text x="559" y="532" class="edge-label" transform="rotate(-90 559 532)" text-anchor="middle">implements</text>

  <!-- ==================== STARTUP WIRING LANE OLLA= -->
  <g id="startup">
    <text x="1010" y="178" class="name mono green-text" style="font-size:14px">bootstrap.tsx</text>
    <text x="1010" y="199" class="role">Composition Root - startup only</text>
    <text x="1010" y="222" class="desc">Creates concrete dependencies,</text>
    <text x="1010" y="239" class="desc">assembles the use case, then</text>
    <text x="1010" y="256" class="desc">supplies it to Presentation.</text>

    <!-- Supply ready operation to Presentation -->
    <path d="M1000 270 H934 Q922 270 922 258 V232 Q922 220 910 220 H866" fill="none" stroke="#7FAE9D" stroke-width="1.5" marker-end="url(#startup-arrow)"/>
    <text x="935" y="292" class="edge-label-startup" text-anchor="middle">supplies operation to Presentation</text>

    <!-- Build use case with adapter -->
    <path d="M1000 392 H916 Q904 392 904 402 H866" fill="none" stroke="#7FAE9D" stroke-width="1.5" marker-end="url(#startup-arrow)"/>
    <text x="937" y="380" class="edge-label-startup" text-anchor="middle">makeCreateTicket(gateway)</text>

    <!-- Create concrete adapter -->
    <path d="M1000 590 H916 Q904 590 904 602 H866" fill="none" stroke="#7FAE9D" stroke-width="1.5" marker-end="url(#startup-arrow)"/>
    <text x="935" y="578" class="edge-label-startup" text-anchor="middle">new HttpTicketGateway()</text>

    <line x1="986" y1="286" x2="986" y2="574" stroke="#7FAE9D" stroke-opacity="0.32" stroke-width="1" stroke-dasharray="2 6"/>
    <text x="1010" y="625" class="edge-label-startup">Not part of the runtime request path.</text>
  </g>

  <!-- ==================== EXTERNAL ==================== -->
  <g id="backend">
    <rect x="610" y="746" width="250" height="112" rx="8" fill="#C9A66B" fill-opacity="0.10" stroke="#C9A66B" stroke-opacity="0.62" stroke-width="1.2"/>
    <line x1="611.5" y1="758" x2="611.5" y2="846" stroke="#C9A66B" stroke-width="3" stroke-linecap="round"/>
    <text x="631" y="779" class="name">Backend API</text>
    <text x="631" y="800" class="role">External system</text>
    <text x="631" y="825" class="desc">Authoritatively creates and</text>
    <text x="631" y="842" class="desc">persists the ticket</text>
  </g>

  <!-- Runtime: adapter -> backend -->
  <line x1="735" y1="664" x2="735" y2="740" stroke="#C9A66B" stroke-width="2.35" marker-end="url(#external-arrow)"/>
  <circle cx="755" cy="701" r="10" fill="#C9A66B"/>
  <text x="755" y="701" class="step">4</text>
  <text x="775" y="695" class="edge-label-external mono">POST /api/tickets</text>
  <text x="775" y="713" class="edge-label">crosses frontend boundary</text>

  <!-- Bottom teaching note -->
  <line x1="280" y1="918" x2="280" y2="942" stroke="#A79DC5" stroke-width="2"/>
  <text x="298" y="928" class="desc"><tspan class="mono" style="font-size:12.5px">TicketGateway</tspan> shapes the source dependency; it is not another runtime hop.</text>
  <text x="298" y="947" class="desc"><tspan class="mono" style="font-size:12.5px">bootstrap.tsx</tspan> performs startup composition; the running request does not pass through it.</text>
</svg>
