<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1060" width="1440" height="1060" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Creating a ticket: Ports and Adapters with Domain</title>
  <desc id="diagram-description">A unified dark-mode architecture diagram. The runtime path goes from Screen to useTickets to createTicket to the injected HttpTicketGateway and then to the external Backend API. Domain is shown as the owner of Ticket, TicketStatus and ticket business rules. Dashed relationships show source-code dependencies; green relationships show startup composition by bootstrap.tsx. TicketGateway is a source contract, not a runtime hop.</desc>

  <defs>
    <style>
      text { font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #E6EDF3; }
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .title { font-size: 25px; font-weight: 650; }
      .subtitle { font-size: 14px; fill: #9DA7B3; }
      .layer { font-size: 15px; font-weight: 650; }
      .layer-note { font-size: 12px; fill: #8B949E; }
      .name { font-size: 16px; font-weight: 650; }
      .role { font-size: 12.5px; fill: #9DA7B3; }
      .desc { font-size: 13px; fill: #C5CDD5; }
      .edge { font-size: 12px; fill: #9DA7B3; }
      .edge-green { font-size: 12px; fill: #A6D6C4; }
      .edge-purple { font-size: 12px; fill: #D1CBE1; }
      .edge-warm { font-size: 12px; fill: #D7BA83; }
      .legend { font-size: 11.5px; fill: #8B949E; }
      .step { font-size: 10.5px; font-weight: 750; fill: #0D1117; text-anchor: middle; dominant-baseline: central; }
    </style>

    <marker id="runtime-arrow" viewBox="0 0 11 10" refX="10" refY="5" markerWidth="10" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L10 5 L1 9 z" fill="#E6EDF3"/>
    </marker>
    <marker id="external-arrow" viewBox="0 0 11 10" refX="10" refY="5" markerWidth="10" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L10 5 L1 9 z" fill="#C9A66B"/>
    </marker>
    <marker id="source-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#A79DC5" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="implements-arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1.5 1.5 L10.5 6 L1.5 10.5 z" fill="none" stroke="#A79DC5" stroke-width="1.2"/>
    </marker>
    <marker id="startup-arrow" viewBox="0 0 11 10" refX="10" refY="5" markerWidth="9" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L10 5 L1 9 z" fill="#7FAE9D"/>
    </marker>
    <marker id="domain-arrow" viewBox="0 0 11 10" refX="10" refY="5" markerWidth="9" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L10 5 L1 9 z" fill="#B790C8"/>
    </marker>
  </defs>

  <!-- GitHub dark background -->
  <rect x="0" y="0" width="1440" height="1060" fill="#0D1117"/>

  <!-- Header -->
  <text x="48" y="56" class="title">Creating a ticket</text>
  <text x="48" y="84" class="subtitle">One frontend system view — runtime calls, Domain rules, source dependencies, and startup wiring</text>

  <!-- Legend -->
  <g transform="translate(885 50)">
    <line x1="0" y1="0" x2="42" y2="0" stroke="#E6EDF3" stroke-width="2.3" marker-end="url(#runtime-arrow)"/>
    <text x="54" y="4" class="legend">runtime</text>
    <line x1="150" y1="0" x2="192" y2="0" strokke="#A79DC5" stroke-width="1.35" stroke-dasharray="5 4" marker-end="url(#source-arrow)"/>
    <text x="204" y="4" class="legend">source dependency</text>
    <line x1="340" y1="0" x2="382" y2="0" stroke="#7FAE9D" stroke-width="1.5" marker-end="url(#startup-arrow)"/>
    <text x="394" y="4" class="legend">startup wiring</text>
  </g>

  <!-- Structural separators -->
  <line x1="48" y1="112" x2="1392" y2="112" stroke="#30363D" stroke-width="1"/>
  <line x1="48" y1="292" x2="1392" y2="292" stroke="#30363D" stroke-width="1"/>
  <line x1="48" y1="508" x2="1392" y2="508" stroke="#30363D" stroke-width="1"/>
  <line x1="48" y1="700" x2="1392" y2="700" stroke="#30363D" stroke-width="1"/>
  <line x1="48" y1="882" x2="1392" y2="882" stroke="#484F58" stroke-width="1" stroke-dasharray="6 6"/>

  <!-- Layer bars and labels -->
  <rect x="48" y="126" width="3" height="150" rx="1.5" fill="#8E9AA9"/>
  <rect x="48" y="306" width="3" height="188" rx="1.5" fill="#7F98BC"/>
  <rect x="48" y="522" width="3" height="164" rx="1.5" fill="#A79DC5"/>
  <rect x="48" y="714" width="3" height="154" rx="1.5" fill="#7FAE9D"/>
  <rect x="48" y="896" width="3" height="120" rx="1.5" fill="#C9A66B"/>

  <text x="70" y="144" class="layer">Presentation</text>
  <text x="70" y="166" class="layer-note">UI and presentation state</text>

  <text x="70" y="324" class="layer">Application</text>
  <text x="70" y="346" class="layer-note">use case and outbound contract</text>

  <text x="70" y="540" class="layer">Domain</text>
  <text x="70" y="562" class="layer-note">business vocabulary, types, and rules</text>

  <text x="70" y="732" class="layer">Infrastructure</text>
  <text x="70" y="754" class="layer-note">technical implementation of the port</text>

  <text x="70" y="914" class="layer" style="fill:#D7BA83">External</text>
  <text x="70" y="936" class="layer-note">outside this frontend</text>

  <!-- PRESENTATION -->
  <g id="screen">
    <rect x="270" y="148" width="220" height="108" rx="8" fill="#161B22" stroke="#6E7B8A" stroke-width="1.2"/>
    <line x1="271.5" y1="160" x2="271.5" y2="244" stroke="#8E9AA9" stroke-width="3" stroke-linecap="round"/>
    <text x="291" y="180" class="name">Screen</text>
    <text x="291" y="201" class="role">UI component</text>
    <text x="291" y="226" class="desc">Shows the form and</text>
    <text x="291" y="243" class="desc">starts the action</text>
  </g>

  <g id="hook">
    <rect x="590" y="148" width="255" height="108" rx="8" fill="#161B22" stroke="#748392" stroke-width="1.2"/>
    <line x1="591.5" y1="160" x2="591.5" y2="244" stroke="#8496AA" stroke-width="3" stroke-linecap="round"/>
    <text x="611" y="180" class="name mono">useTickets()</text>
    <text x="611" y="201" class="role">Presentation hook</text>
    <text x="611" y="226" class="desc">Owns UI state; submit calls</text>
    <text x="611" y="243" class="desc">the supplied operation</text>
  </g>

  <line x1="496" y1="202" x2="584" y2="202" stroke="#E6EDF3" stroke-width="2.3" marker-end="url(#runtime-arrow)"/>
  <circle cx="540" cy="182" r="10" fill="#E6EDF3"/>
  <text x="540" y="182" class="step">1</text>
  <text x="540" y="228" class="edge" text-anchor="middle">uses hook</text>

  <!-- APPLICATION -->
  <g id="port">
    <rect x="270" y="344" width="220" height="112" rx="8" fill="#161B22" stroke="#A79DC5" stroke-width="1.2" stroke-dasharray="5 4"/>
    <line x1="271.5" y1="356" x2="271.5" y2="444" stroke="#A79DC5" stroke-width="3" stroke-linecap="round"/>
    <text x="291" y="378" class="name mono" style="fill:#D1CBE1">TicketGateway</text>
    <text x="291" y="399" class="role">Port / contract</text>
    <text x="291" y="424" class="desc">Defines the create(input)</text>
    <text x="291" y="441" class="desc">capability the use case needs</text>
  </g>

  <g id="usecase">
    <rect x="590" y="344" width="255" height="112" rx="8" fill="#161B22" stroke="#7F98BC" stroke-width="1.2"/>
    <line x1="591.5" y1="356" x2="591.5" y2="444" stroke="#7F98BC" stroke-width="3" stroke-linecap="round"/>
    <text x="611" y="378" class="name mono">createTicket()</text>
    <text x="611" y="399" class="role">Use case</text>
    <text x="611" y="424" class="desc">Coordinates ticket creation</text>
    <text x="611" y="441" class="desc">without knowing HTTP</text>
  </g>

  <line x1="717" y1="262" x2="717" y2="338" stroke="#E6EDF3" stroke-width="2.3" marker-end="url(#runtime-arrow)"/>
  <circle cx="737" cy="301" r="10" fill="#E6EDF3"/>
  <text x="737" y="301" class="step">2</text>
  <text x="759" y="305" class="edge">submit(input) calls supplied createTicket</text>

  <line x1="584" y1="400" x2="496" y2="400" stroke="#A79DC5" stroke-width="1.35" stroke-dasharray="5 4" marker-end="url(#source-arrow)"/>
  <text x="540" y="386" class="edge-purple" text-anchor="middle">depends on</text>

  <!-- DOMAIN -->
  <g id="domain">
    <rect x="430" y="548" width="420" height="116" rx="8" fill="#161B22" stroke="#A79DC5" stroke-width="1.2"/>
    <line x1="431.5" y1="560" x2="431.5" y2="652" stroke="#A79DC5" stroke-width="3" stroke-linecap="round"/>
    <text x="452" y="580" class="name">Ticket model &amp; rules</text>
    <text x="452" y="601" class="role">Domain-owned business meaning</text>
    <text x="452" y="626" class="desc mono">Ticket · TicketStatus · TICKET_STATUSES</text>
    <text x="452" y="646" class="desc mono">normalizeTicketSubject() · isTicketSubject() · isTicketStatus()</text>
  </g>

  <!-- Application -> Domain runtime rule execution -->
  <path d="M717 462 V520 Q717 532 705 532 H668 Q656 532 656 542" fill="none" stroke="#B790C8" stroke-width="1.8" marker-end="url(#domain-arrow)"/>
  <text x="735" y="500" class="edge-purple">runtime: applies subject rule</text>

  <!-- Port -> Domain source dependency -->
  <path d="M380 462 V514 Q380 526 392 526 H624" fill="none" stroke="#A79DC5" stroke-width="1.35" stroke-dasharray="5 4" marker-end="url(#source-arrow)"/>
  <text x="318" y="504" class="edge-purple">returns Ticket</text>

  <!-- INFRASTRUCTURE ==>
  <g id="adapter">
    <rect x="590" y="740" width="255" height="108" rx="8" fill="#161B22" stroke="#7FAE9D" stroke-width="1.2"/>
    <line x1="591.5" y1="752" x2="591.5" y2="836" stroke="#7FAE9D" stroke-width="3" stroke-lineap="round"/>
    <text x="611" y="772" class="name mono">HttpTicketGateway</text>
    <text x="611" y="793" class="role">HTTP adapter</text>
    <text x="611" y="818" class="desc">Validates and maps the</text>
    <text x="611" y="835" class="desc">external HTTP contract</text>
  </g>

  <!-- Use case -> adapter runtime -->
  <path d="M810 462 H870 Q882 462 882 474 V708 Q882 720 870 720 H826 Q814 720 814 734" fill="none" stroke="#E6EDF3" stroke-width="2.3" marker-end="url(#runtime-arrow)"/>
  <circle cx="900" cy="596" r="10" fill="#E6EDF3"/>
  <text x="900" y="596" class="step">3</text>
  <text x="918" y="600" class="edge">gateway.create(input)</text>

  <!-- Adapter implements port source dependency -->
  <path d="M584 794 H236 Q224 794 224 782 V412 Q224 400 236 400 H264" fill="none" stroke="#A79DC5" stroke-width="1.35" stroke-dasharray="5 4" marker-end="url(#implements-arrow)"/>
  <text x="211" y="600" class="edge-purple" transform="rotate(-90 211 600)" text-anchor="middle">implements</text>

  <!-- Adapter -> Domain source dependency -->
  <path d="M851 774 H954 Q966 774 966 762 V616 Q966 604 954 604 H856" fill="none" stroke="#A79DC5" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#source-arrow)"/>
  <text x="980" y="690" class="edge-purple">uses Domain vocabulary / guards</text>

  <!-- COMPOSITION ROOT: startup-only side lane -->
  <g id="composition-root">
    <rect x="1000" y="176" width="330" height="180" rx="8" fill="#161B22" stroke="#7FAE9D" stroke-width="1.2"/>
    <line x1="1001.5" y1="188" x2="1001.5" y2="344" stroke="#7FAE9D" stroke-width="3" stroke-linecap="round"/>
    <text x="1022" y="210" class="name mono" style="fill:#A6D6C4">bootstrap.tsx</text>
    <text x="1022" y="231" class="role">Composition Root · startup only</text>
    <text x="1022" y="258" class="desc">Creates concrete dependencies,</text>
    <text x="1022" y="276" class="desc">assembles the use case, then</text>
    <text x="1022" y="294" class="desc">supplies it to Presentation.</text>
    <text x="1022" y="326" class="edge-green">Not part of the runtime request path.</text>
  </g>

  <!-- Startup: create adapter -->
  <path d="M1000 300 H940 Q928 300 928 312 V782 Q928 794 916 794 H851" fill="none" stroke="#7FAE9D" stroke-width="1.5" marker-end="url(#startup-arrow)"/>
  <text x="949" y="584" class="edge-green" transform="rotate(-90 949 584)" text-anchor="middle">new HttpTicketGateway()</text>

  <!-- Startup: assemble use case -->
  <path d="M1000 248 H910 Q898 248 898 260 V386 Q898 398 886 398 H851" fill="none" stroke="#7FAE9D" stroke-width="1.5" marker-end="url(#startup-arrow)"/>
  <text x="915" y="330" class="edge-green">makeCreateTicket(gateway)</text>

  <!-- Startup: supply ready use case to Presentation -->
  <path d="M1000 212 H920 Q908 212 908 200 H851" fill="none" stroke="#7FAE9D" stroke-width="1.5" marker-end="url(#startup-arrow)"/>
  <text x="920" y="194" class="edge-green">supplies createTicket</text>

  <!-- EXTERNAL -->
  <g id="backend">
    <rect x="590" y="914" width="255" height="100" rx="8" fill="#161B22" stroke="#C9A66B" stroke-width="1.2"/>
    <line x1="591.5" y1="926" x2="591.5" y2="1002" stroke="#C9A66B" stroke-width="3" stroke-linecap="round"/>
    <text x="611" y="946" class="name">Backend API</text>
    <text x="611" y="967" class="role">External system</text>
    <text x="611" y="992" class="desc">Authoritatively creates and persists the ticket</text>
  </g>

  <line x1="718" y1="854" x2="718" y2="908" stroke="#C9A66B" stroke-width="2.3" marker-end="url(#external-arrow)"/>
  <circle cx="738" cy="881" r="10" fill="#C9A66B"/>
  <text x="738" y="881" class="step">4</text>
  <text x="760" y="878" class="edge-warm mono">POST /api/tickets</text>
  <text x="760" y="896" class="edge">crosses frontend boundary</text>

  <!-- Teaching note -->
  <line x1="1010" y1="748" x2="1010" y2="838" stroke="#A79DC5" stroke-width="2"/>
  <text x="1028" y="770" class="desc"><tspan class="mono">Domain</tspan> owns ticket meaning and rules;</text>
  <text x="1028" y="791" class="desc">it is not another transport hop.</text>
  <text x="1028" y="819" class="desc"><tspan class="mono">TicketGateway</tspan> shapes the dependency;</text>
  <text x="1028" y="840" class="desc">the runtime call goes to the injected adapter.</text>
</svg>
