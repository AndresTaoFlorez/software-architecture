<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 790" width="1380" height="790" role="img" aria-labelledby="t d">
  <title id="t">Creating a ticket: one system view</title>
  <desc id="d">Runtime path Screen to createTicket to HttpTicketGateway to POST /api/tickets to Backend API. Source-code relationships (depends on, implements) are dashed and sit above. Startup wiring injects HttpTicketGateway into createTicket and sits below.</desc>

  <defs>
    <style>
      text { font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #E6E9EE; }
      .m { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .name { font-size: 16px; font-weight: 500; }
      .role { font-size: 12.5px; fill: #9FA8B3; }
      .desc { font-size: 13px; fill: #C3C9D1; }
      .gut { font-size: 12.5px; fill: #737C87; letter-spacing: 0.3px; }
      .rel { font-size: 12.5px; fill: #9FA8B3; }
      .tiny { font-size: 12px; fill: #737C87; }
      .note { font-size: 14.5px; fill: #E6E9EE; }
    </style>

    <marker id="dep" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#A69DC4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="impl" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1.5 1.5 L10.5 6 L1.5 10.5 z" fill="none" stroke="#A69DC4" stroke-width="1.3" stroke-linejoin="round"/>
    </marker>
    <marker id="asm" viewBox="0 0 11 10" refX="10" refY="5" markerWidth="9" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L10 5 L1 9 z" fill="#7FAE9D"/>
    </marker>
    <marker id="run" viewBox="0 0 11 10" refX="10" refY="5" markerWidth="11" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L10 5 L1 9 z" fill="#E6E9EE"/>
    </marker>
    <marker id="runx" viewBox="0 0 11 10" refX="10" refY="5" markerWidth="11" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L10 5 L1 9 z" fill="#C9A66B"/>
    </marker>
  </defs>

  <!-- Frontend boundary: one quiet line -->
  <line x1="884" y1="164" x2="884" y2="690" stroke="#E6E9EE" stroke-opacity="0.28" stroke-width="1.25" stroke-dasharray="3 6"/>
  <text x="872" y="150" class="rel" text-anchor="end">Frontend</text>
  <text x="896" y="150" class="rel">Outside the frontend</text>

  <!-- Gutter labels for the three ways of reading the system -->
  <text x="70" y="190" class="gut">Source code</text>
  <text x="70" y="398" class="gut">Runtime</text>
  <text x="70" y="560" class="gut">Startup</text>

  <!-- ============ SOURCE-CODE LAYER ============ -->
  <!-- TicketGateway (port / contract) -->
  <rect x="473" y="170" width="230" height="116" rx="8" fill="#A69DC4" fill-opacity="0.07" stroke="#A69DC4" stroke-opacity="0.6" stroke-width="1.25" stroke-dasharray="5 4"/>
  <line x1="474.5" y1="182" x2="474.5" y2="274" stroke="#A69DC4" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round"/>
  <text x="493" y="204" class="name m" style="fill:#CFC9E0">TicketGateway</text>
  <text x="493" y="225" class="role">Port / contract</text>
  <text x="493" y="250" class="desc">Describes what the</text>
  <text x="493" y="267" class="desc">operation needs</text>

  <!-- depends on -->
  <path d="M439 410 V240 Q439 228 451 228 H471" fill="none" stroke="#A69DC4" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#dep)"/>
  <text x="427" y="330" class="rel" text-anchor="end">depends on</text>
  <!-- implements -->
  <path d="M738 410 V240 Q738 228 726 228 H705" fill="none" stroke="#A69DC4" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#impl)"/>
  <text x="750" y="330" class="rel">implements</text>

  <!-- The contract is skipped at runtime -->
  <line x1="588" y1="290" x2="588" y2="465" stroke="#737C87" stroke-width="1.2" stroke-dasharray="1.5 4" stroke-linecap="round"/>
  <circle cx="588" cy="470" r="3.5" fill="#737C87"/>
  <text x="600" y="372" class="tiny">skipped at runtime</text>

  <!-- ============ RUNTIME LAYER ============ -->
  <!-- Screen -->
  <rect x="70" y="412" width="190" height="116" rx="8" fill="#93A0B2" fill-opacity="0.12" stroke="#93A0B2" stroke-opacity="0.55" stroke-width="1.25"/>
  <line x1="71.5" y1="424" x2="71.5" y2="516" stroke="#93A0B2" stroke-width="3" stroke-linecap="round"/>
  <text x="90" y="446" class="name">Screen</text>
  <text x="90" y="467" class="role">UI</text>
  <text x="90" y="492" class="desc">Starts the ticket</text>
  <text x="90" y="509" class="desc">creation action</text>

  <!-- createTicket() -->
  <rect x="324" y="412" width="230" height="116" rx="8" fill="#7F98BC" fill-opacity="0.13" stroke="#7F98BC" stroke-opacity="0.6" stroke-width="1.25"/>
  <line x1="325.5" y1="424" x2="325.5" y2="516" stroke="#7F98BC" stroke-width="3" stroke-linecap="round"/>
  <text x="344" y="446" class="name m">createTicket()</text>
  <text x="344" y="467" class="role">Use case</text>
  <text x="344" y="492" class="desc">Coordinates the</text>
  <text x="344" y="509" class="desc">ticket-creation operation</text>

  <!-- HttpTicketGateway -->
  <rect x="618" y="412" width="240" height="116" rx="8" fill="#7FAE9D" fill-opacity="0.12" stroke="#7FAE9D" stroke-opacity="0.6" stroke-width="1.25"/>
  <line x1="619.5" y1="424" x2="619.5" y2="516" stroke="#7FAE9D" stroke-width="3" stroke-linecap="round"/>
  <text x="638" y="446" class="name m">HttpTicketGateway</text>
  <text x="638" y="467" class="role">HTTP adapter</text>
  <text x="638" y="492" class="desc">Provides the HTTP</text>
  <text x="638" y="509" class="desc">implementation</text>

  <!-- Backend API -->
  <rect x="1090" y="412" width="220" height="116" rx="8" fill="#C9A66B" fill-opacity="0.11" stroke="#C9A66B" stroke-opacity="0.6" stroke-width="1.25"/>
  <line x1="1091.5" y1="424" x2="1091.5" y2="516" stroke="#C9A66B" stroke-width="3" stroke-linecap="round"/>
  <text x="1110" y="446" class="name">Backend API</text>
  <text x="1110" y="467" class="role">External system</text>
  <text x="1110" y="492" class="desc">Receives the</text>
  <text x="1110" y="509" class="desc">HTTP request</text>

  <!-- Runtime calls: solid, dominant -->
  <line x1="264" y1="470" x2="320" y2="470" stroke="#E6E9EE" stroke-width="2.5" marker-end="url(#run)"/>
  <line x1="558" y1="470" x2="614" y2="470" stroke="#E6E9EE" stroke-width="2.5" marker-end="url(#run)"/>
  <line x1="862" y1="470" x2="1086" y2="470" stroke="#C9A66B" stroke-width="2.5" marker-end="url(#runx)"/>
  <text x="974" y="456" class="m" style="font-size:13px;fill:#C9A66B" text-anchor="middle">POST /api/tickets</text>
  <text x="974" y="494" class="tiny" text-anchor="middle">HTTP request</text>

  <!-- ============ STARTUP WIRING ============ -->
  <circle cx="738" cy="532" r="3.5" fill="#7FAE9D"/>
  <path d="M738 532 V584 Q738 596 726 596 H451 Q439 596 439 584 V533" fill="none" stroke="#7FAE9D" stroke-width="1.5" marker-end="url(#asm)"/>
  <text x="588" y="580" class="rel" text-anchor="middle" style="fill:#9CC2B4">injected at startup</text>
  <text x="588" y="620" class="m" text-anchor="middle" style="font-size:12.5px;fill:#C3C9D1">makeCreateTicket(gateway)</text>
  <text x="588" y="640" class="tiny" text-anchor="middle">assembled when the app starts</text>

  <!-- ============ LEGEND ============ -->
  <text x="940" y="592" class="tiny">Line styles</text>
  <line x1="940" y1="614" x2="986" y2="614" stroke="#A69DC4" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="1000" y="618" class="rel">source-code dependency</text>
  <line x1="940" y1="638" x2="986" y2="638" stroke="#7FAE9D" stroke-width="1.5"/>
  <text x="1000" y="642" class="rel">startup wiring</text>
  <line x1="940" y1="662" x2="986" y2="662" stroke="#E6E9EE" stroke-width="2.5"/>
  <text x="1000" y="666" class="rel">runtime call</text>

  <!-- ============ TEACHING NOTE ============ -->
  <line x1="70" y1="706" x2="70" y2="758" stroke="#A69DC4" stroke-opacity="0.7" stroke-width="2"/>
  <text x="88" y="724" class="note"><tspan class="m" style="font-size:13.5px">TicketGateway</tspan> shapes the dependency in code.</text>
  <text x="88" y="750" class="note">At runtime, <tspan class="m" style="font-size:13.5px">createTicket()</tspan> calls the injected <tspan class="m" style="font-size:13.5px">HttpTicketGateway</tspan> instance directly.</text>
</svg>
