name: Documentation quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify documentation and executable examples
        run: npm run check

      - name: Show glossary-link suggestions if checks fail
        if: failure()
        run: |
          node scripts/glossary-links.mjs --write
          git diff --color=never -- '*.md'
