name: Documentation quality

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'glossary/terms.json'
      - 'scripts/*.mjs'
      - '.github/workflows/glossary-links.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'glossary/terms.json'
      - 'scripts/*.mjs'
      - '.github/workflows/glossary-links.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check glossary links
        run: node scripts/glossary-links.mjs --check
      - name: Check documentation structure and diagrams
        run: node scripts/docs-quality.mjs
