name: Documentation quality

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'glossary/terms.json'
      - 'scripts/*.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/glossary-links.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'glossary/terms.json'
      - 'scripts/*.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/glossary-links.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check documentation script regressions
        run: npm run test:scripts
      - name: Check glossary links
        run: node scripts/glossary-links.mjs --check
      - name: Check documentation structure and diagrams
        run: node scripts/docs-quality.mjs
