name: Handbook site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# PRs never share the production group. Cancel obsolete main builds/deployments.
concurrency:
  group: handbook-site-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Site checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.1'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Select supported npm
        run: npm install --global npm@10.8.2
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check Astro and TypeScript
        run: npm run check
      - name: Build production output
        run: npm run build
      - name: Test content, routes, links and anchors
        run: npm test
      - name: Smoke test production preview
        run: npm run smoke
      - name: Upload validated Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/dist
          include-hidden-files: false

  deploy:
    name: Deploy Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
